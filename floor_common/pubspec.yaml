name: floor_common
description: >
  The typesafe, reactive, and lightweight SQLite abstraction for your Flutter applications.
  This library is the runtime dependency.
version: 1.2.0
homepage: https://floor.codes
publish_to: none

environment:
  sdk: ^3.10.1

dependencies:
  floor_annotation:
    path: ../floor_annotation/
  meta:
  path: ^1.9.1
  sqflite_common: ^2.5.6
  sqlparser: ^0.42.0

dev_dependencies:
  build_runner: ^2.10.4
  collection: ^1.19.1
  floor_generator:
    path: ../floor_generator/
  sqflite_common_ffi: ^2.3.3
  test: ^1.28.0
  matcher: ^0.12.18
  mockito: ^5.6.1
