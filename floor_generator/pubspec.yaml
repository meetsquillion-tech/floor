name: floor_generator
description: >
  The typesafe, reactive, and lightweight SQLite abstraction for your Flutter applications.
  This library is the dev dependency.
version: 1.4.2
homepage: https://pinchbv.github.io/floor/
repository: https://github.com/pinchbv/floor
issue_tracker: https://github.com/pinchbv/floor/issues
publish_to: none

environment:
  sdk: '>=2.12.6 <4.0.0'

dependencies:
  analyzer: ^8.1.1
  build: ^4.0.3
  build_config: ^1.2.0
  code_builder: ^4.11.0
  collection: ^1.19.1
  floor_annotation:
    path: ../floor_annotation
  meta:
  source_gen: ^4.1.1
  strings: ^4.0.1

dev_dependencies:
  build_test: ^3.5.4
  dart_style: <3.1.3
  mockito: ^5.6.1
  path: ^1.9.1
  pub_semver: ^2.2.0
